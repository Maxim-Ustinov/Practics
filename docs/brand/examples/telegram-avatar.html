body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
.avatar{width:512px;height:512px;border-radius:50%;overflow:hidden;background:#1F1F1F;box-shadow:0 24px 60px rgba(20,24,36,.28)}
.avatar svg{width:100%;height:100%;display:block}
.caption{text-align:center;font-size:14px;line-height:1.5;color:#646872}.caption b{color:#25282F}
.sizes{display:flex;align-items:flex-end;gap:18px}.size{text-align:center;font-size:11px;color:#737780}.size span{display:block;margin-top:6px}.size svg{display:block;border-radius:25%;background:#1F1F1F}.size.s128 svg{width:128px;height:128px}.size.s64 svg{width:64px;height:64px}.size.s40 svg{width:40px;height:40px}
@media print{@page{size:A4;margin:18mm}body{background:#fff;padding:0}.caption{display:none}.avatar{box-shadow:none}.sizes{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
