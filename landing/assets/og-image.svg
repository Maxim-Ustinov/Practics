<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="TenderScope — умный поиск закупок для бизнеса">
  <defs>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#3A63D8"/>
    </linearGradient>
    <linearGradient id="scopeText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BA0FF"/>
      <stop offset="1" stop-color="#4F7CFF"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#1F1F1F"/>
  <circle cx="980" cy="120" r="420" fill="url(#glowBlue)"/>
  <circle cx="120" cy="590" r="300" fill="url(#glowGold)"/>

  <g opacity="0.5" fill="#F5F5F7">
    <circle cx="60" cy="60" r="1.4"/><circle cx="120" cy="60" r="1.4"/><circle cx="180" cy="60" r="1.4"/>
    <circle cx="60" cy="120" r="1.4"/><circle cx="120" cy="120" r="1.4"/><circle cx="180" cy="120" r="1.4"/>
    <circle cx="60" cy="180" r="1.4"/><circle cx="120" cy="180" r="1.4"/><circle cx="180" cy="180" r="1.4"/>
  </g>

  <g transform="translate(78 128)">
    <circle cx="52" cy="52" r="42" fill="none" stroke="#4F7CFF" stroke-width="7"/>
    <path d="M84 84 112 112" fill="none" stroke="#4F7CFF" stroke-width="11" stroke-linecap="round"/>
    <circle cx="34" cy="40" r="2.6" fill="#7BA0FF"/>
    <circle cx="66" cy="36" r="2.6" fill="#7BA0FF"/>
    <circle cx="30" cy="64" r="2.6" fill="#7BA0FF"/>
    <circle cx="70" cy="66" r="2.6" fill="#7BA0FF"/>
    <circle cx="58" cy="48" r="3.4" fill="#FFB547"/>
    <path d="M32 56 46 70 72 39" fill="none" stroke="#FFB547" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="248" y="226" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F5F5F7">Tender<tspan fill="url(#scopeText)">Scope</tspan></text>

  <text x="80" y="342" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6" fill="#F5F5F7">Умный поиск закупок</text>
  <text x="80" y="390" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6" fill="#7BA0FF">для бизнеса</text>

  <text x="80" y="448" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#A6A6AE">44-ФЗ и 223-ФЗ · данные ЕИС zakupki.gov.ru</text>

  <g font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="80" y="492" width="158" height="46" rx="23" fill="#262626" stroke="#3A3A3E"/>
    <text x="103" y="521" fill="#F5F5F7">Чат-поиск</text>
    <rect x="252" y="492" width="160" height="46" rx="23" fill="#262626" stroke="#3A3A3E"/>
    <text x="275" y="521" fill="#F5F5F7">AI-оценка</text>
    <rect x="426" y="492" width="188" height="46" rx="23" fill="#262626" stroke="#3A3A3E"/>
    <text x="449" y="521" fill="#F5F5F7">Push в ЕИС</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="780" y="92" width="342" height="452" rx="34" fill="#0D0D0E" stroke="#3A3A3D"/>
    <rect x="789" y="101" width="324" height="434" rx="26" fill="#1F1F1F"/>
    <rect x="885" y="101" width="132" height="24" rx="12" fill="#0D0D0E"/>

    <text x="810" y="145" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#F5F5F7">TenderScope</text>
    <circle cx="1082" cy="140" r="10" fill="#262626" stroke="#333333"/>

    <g font-family="Manrope, Segoe UI, Arial, sans-serif">
      <rect x="808" y="168" width="238" height="58" rx="14" fill="#262626" stroke="#2A2A2A"/>
      <text x="822" y="192" font-size="11.5" font-weight="500" fill="#F5F5F7">Опишите, какие закупки ищете:</text>
      <text x="822" y="210" font-size="11.5" font-weight="500" fill="#F5F5F7">что, где и на какую сумму.</text>

      <rect x="892" y="240" width="200" height="40" rx="14" fill="url(#userBubble)"/>
      <text x="906" y="265" font-size="11.5" font-weight="600" fill="#FFFFFF">Ремонт зданий в Москве</text>

      <rect x="808" y="294" width="246" height="44" rx="14" fill="#262626" stroke="#2A2A2A"/>
      <text x="822" y="321" font-size="11.5" font-weight="500" fill="#F5F5F7">Готово. Собрал профиль поиска.</text>

      <rect x="834" y="350" width="92" height="22" rx="6" fill="#243052" stroke="#3D548F"/>
      <text x="844" y="365" font-size="8.5" font-weight="700" fill="#7BA0FF">Ремонт зданий</text>
      <rect x="932" y="350" width="56" height="22" rx="6" fill="#243052" stroke="#3D548F"/>
      <text x="944" y="365" font-size="8.5" font-weight="700" fill="#7BA0FF">Москва</text>
    </g>

    <rect x="808" y="386" width="286" height="104" rx="14" fill="#1B1B1C" stroke="#333333"/>
    <rect x="820" y="398" width="42" height="42" rx="10" fill="#1E3A2C" stroke="#2E6A4C"/>
    <text x="834" y="417" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#3CCB7F">78</text>
    <text x="830" y="431" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="6" font-weight="800" fill="#3CCB7F">БАЛЛ</text>

    <text x="874" y="410" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#F5F5F7">Ремонт помещений</text>
    <text x="874" y="426" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#F5F5F7">в административном здании</text>
    <text x="874" y="443" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8F8F97">Москва · 44-ФЗ</text>

    <text x="820" y="470" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#F5F5F7">4 800 000 ₽</text>
    <rect x="1000" y="455" width="82" height="22" rx="6" fill="#3A2C18" stroke="#6A4A24"/>
    <text x="1010" y="470" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFA640">До 18.11 · 6 дн</text>

    <rect x="808" y="502" width="286" height="1" fill="#2A2A2A"/>
    <text x="820" y="524" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#8F8F97">Спросите про закупки…</text>
    <rect x="1052" y="510" width="28" height="28" rx="8" fill="url(#userBubble)"/>
    <path d="m1061 524 10-6-3 10-3-4-4 0Z" fill="#FFFFFF"/>
  </g>
</svg>
